name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      GH_TOKEN: ${{ github.token }}
      # Windows programs are signed through SignPath for releases (version
      # tags) once the repository has the SIGNPATH_API_TOKEN secret and the
      # SIGNPATH_ORGANIZATION_ID variable. Until then, and for every other
      # build, nothing is signed. See SIGNING.md.
      SIGN: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

      - name: Build the Windows programs
        run: |
          mkdir dist
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-H=windowsgui" -o dist/PulseUSB.exe ./cmd/pulseusb-gui
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/pulseusb-client.exe ./cmd/pulseusb-client
          mkdir -p to-sign && cp dist/PulseUSB.exe dist/pulseusb-client.exe to-sign/

      # Signing, part 1: the programs, before the setup program packs them.
      - name: Upload the programs for signing
        id: unsigned-programs
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-programs
          path: to-sign/
      - name: Sign the programs
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'PulseUSB' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned-programs.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600 # time to approve the request in SignPath
          output-artifact-directory: signed-programs
      - name: Use the signed programs
        if: env.SIGN == 'true'
        run: cp signed-programs/PulseUSB.exe signed-programs/pulseusb-client.exe dist/

      - name: Build the setup program
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nsis
          # Bundle the usbip-win2 driver installer, so installing does not
          # depend on a download. If that ever fails, the setup program still
          # works: it then downloads the driver while installing.
          mkdir -p /tmp/usbip
          if gh release download --repo vadimgrn/usbip-win2 --pattern '*x64*.exe' --dir /tmp/usbip; then
            exe="$(ls /tmp/usbip/*.exe | grep -vi debug | head -1)"
            if [ -n "$exe" ]; then cp "$exe" installer/vendor/usbip-win2-setup.exe; fi
          fi
          if [ ! -f installer/vendor/usbip-win2-setup.exe ]; then
            echo "::warning::usbip-win2 installer not bundled; setup will download it"
          fi
          makensis -V2 -DVERSION="$(sed -n 's/^const Version = "\(.*\)"$/\1/p' internal/gui/engine.go)" installer/pulseusb.nsi
          mkdir -p setup-to-sign && cp dist/PulseUSB-Setup.exe setup-to-sign/

      # Signing, part 2: the setup program, built around the signed app.
      - name: Upload the setup program for signing
        id: unsigned-setup
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup
          path: setup-to-sign/
      - name: Sign the setup program
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'PulseUSB' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-setup
      - name: Use the signed setup program
        if: env.SIGN == 'true'
        run: cp signed-setup/PulseUSB-Setup.exe dist/

      - name: Build the Linux programs
        run: |
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build -trimpath -ldflags="-s -w" -o dist/pulseusb-linux-$arch ./cmd/pulseusb-gui
            GOOS=linux GOARCH=$arch go build -trimpath -ldflags="-s -w" -o dist/pulseusb-server-linux-$arch ./cmd/pulseusb-server
            GOOS=linux GOARCH=$arch go build -trimpath -ldflags="-s -w" -o dist/pulseusb-client-linux-$arch ./cmd/pulseusb-client
          done
          GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags="-s -w" -o dist/pulseusb-server-linux-armv7 ./cmd/pulseusb-server
          # Checksums, so downloads can be checked against what was built here.
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: pulseusb
          path: dist/
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
